<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="快慢双通道：四级晋级阶梯与路由器的四种动作">
<title>快慢双通道：四级晋级阶梯与路由器的四种动作</title>
<defs><marker id="ah2a78d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2a78d6"/></marker><marker id="ahe34948" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#e34948"/></marker><marker id="ah52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#52514e"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif;fill:#0b0b0b} .s{fill:#52514e} .m{fill:#8a8984}</style>
<rect width="1200" height="700" rx="12" fill="#fcfcfb"/>
<text x="40.0" y="42.0" font-size="22" font-weight="700">快慢双通道：四级晋级阶梯 + 路由器的四种动作</text>
<text x="40.0" y="68.0" font-size="14" class="s">用回忆逐步替代计算：每次晋级都有可测的证据门槛；一旦失败就降级，旧版本保留。</text>
<text x="40.0" y="108.0" font-size="15" font-weight="700">晋级阶梯（M7 技能缓存）</text>
<rect x="110.0" y="128.0" width="300.0" height="86.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.6"/>
<rect x="110.0" y="128.0" width="58.0" height="86.0" rx="10" fill="#104281"/>
<rect x="158.0" y="128.0" width="10.0" height="86.0" fill="#104281"/>
<text x="139.0" y="178.0" font-size="20" text-anchor="middle" font-weight="700" style="fill:#fff">L3</text>
<text x="182.0" y="156.0" font-size="16" font-weight="700">运动自动化</text>
<rect x="350.6" y="140.0" width="49.4" height="22.0" rx="11" fill="#f4f3ef"/>
<text x="375.3" y="155.5" font-size="12" text-anchor="middle" font-weight="700">&lt;1 ms</text>
<text x="182.0" y="180.0" font-size="12" class="s">直接展开动作程序（sigma-lognormal</text>
<text x="182.0" y="197.0" font-size="12" class="s">/ 缓存波形）</text>
<rect x="110.0" y="268.0" width="300.0" height="86.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.6"/>
<rect x="110.0" y="268.0" width="58.0" height="86.0" rx="10" fill="#256abf"/>
<rect x="158.0" y="268.0" width="10.0" height="86.0" fill="#256abf"/>
<text x="139.0" y="318.0" font-size="20" text-anchor="middle" font-weight="700" style="fill:#fff">L2</text>
<text x="182.0" y="296.0" font-size="16" font-weight="700">查表习惯</text>
<rect x="348.0" y="280.0" width="52.0" height="22.0" rx="11" fill="#f4f3ef"/>
<text x="374.0" y="295.5" font-size="12" text-anchor="middle" font-weight="700">微秒级</text>
<text x="182.0" y="320.0" font-size="12" class="s">任务键或感知签名 → 输出程序</text>
<rect x="110.0" y="408.0" width="300.0" height="86.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.6"/>
<rect x="110.0" y="408.0" width="58.0" height="86.0" rx="10" fill="#3987e5"/>
<rect x="158.0" y="408.0" width="10.0" height="86.0" fill="#3987e5"/>
<text x="139.0" y="458.0" font-size="20" text-anchor="middle" font-weight="700" style="fill:#0b0b0b">L1</text>
<text x="182.0" y="436.0" font-size="16" font-weight="700">编译规则</text>
<rect x="332.9" y="420.0" width="67.1" height="22.0" rx="11" fill="#f4f3ef"/>
<text x="366.4" y="435.5" font-size="12" text-anchor="middle" font-weight="700">0.1–1 ms</text>
<text x="182.0" y="460.0" font-size="12" class="s">Soar / CLIPS 产生式匹配（10⁴ 条规</text>
<text x="182.0" y="477.0" font-size="12" class="s">则量级）</text>
<rect x="110.0" y="548.0" width="300.0" height="86.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.6"/>
<rect x="110.0" y="548.0" width="58.0" height="86.0" rx="10" fill="#86b6ef"/>
<rect x="158.0" y="548.0" width="10.0" height="86.0" fill="#86b6ef"/>
<text x="139.0" y="598.0" font-size="20" text-anchor="middle" font-weight="700" style="fill:#0b0b0b">L0</text>
<text x="182.0" y="576.0" font-size="16" font-weight="700">深思</text>
<rect x="341.5" y="560.0" width="58.5" height="22.0" rx="11" fill="#f4f3ef"/>
<text x="370.8" y="575.5" font-size="12" text-anchor="middle" font-weight="700">0.1–5 s</text>
<text x="182.0" y="600.0" font-size="12" class="s">工作空间 + 专家工具箱 + 可选 LM，</text>
<text x="182.0" y="617.0" font-size="12" class="s">anytime 可打断</text>
<path d="M350.0,546.0 L350.0,497.0" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2a78d6)"/>
<text x="424.0" y="518.0" font-size="12.5" font-weight="700">≥3 次一致成功</text>
<text x="424.0" y="536.0" font-size="12" class="s">chunking 编译为规则</text>
<path d="M350.0,406.0 L350.0,357.0" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2a78d6)"/>
<text x="424.0" y="378.0" font-size="12.5" font-weight="700">≥20 次且影子一致率 ≥98%</text>
<text x="424.0" y="396.0" font-size="12" class="s">升为查表</text>
<path d="M350.0,266.0 L350.0,217.0" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2a78d6)"/>
<text x="424.0" y="238.0" font-size="12.5" font-weight="700">ProMP 方差收敛</text>
<text x="424.0" y="256.0" font-size="12" class="s">且读回错误率 &lt;2%（运动技能）</text>
<path d="M72,148 V614" fill="none" stroke="#e34948" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahe34948)"/>
<text x="62.0" y="381.0" font-size="12.5" text-anchor="middle" class="s" transform="rotate(-90 62 381.0)">失败即降级 · 旧版本保留</text>
<text x="40.0" y="674.0" font-size="12.5" class="s">慢路成功解立即进入 L2 候选试用期：Beta(2,1)，前 N 次强制 FAST+VERIFY。</text>
<text x="640.0" y="108.0" font-size="15" font-weight="700">路由器（M6 元认知路由器）</text>
<rect x="640.0" y="122.0" width="530.0" height="76.0" rx="10" fill="#f4f3ef"/>
<text x="654.0" y="145.0" font-size="13" font-weight="700">输入：置信度契约</text>
<text x="654.0" y="166.0" font-size="12" class="s">校准概率 · 共形集大小 · 新颖度（kNN 百分位）· top1–top2 间隔 · 预计代价</text>
<text x="654.0" y="184.0" font-size="12" class="s">+ Count-Min 计数（见过吗）· 技能 Beta 后验 95% 下界 · IMM / 集成方差</text>
<path d="M905.0,198.0 L905.0,216.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
<rect x="640.0" y="218.0" width="530.0" height="38.0" rx="10" fill="#fff" stroke="#52514e" stroke-width="1.6"/>
<text x="905.0" y="242.0" font-size="13" text-anchor="middle" font-weight="700">CART 决策树（深度 ≤6，冷启动由约 30 条先天规则写成）</text>
<rect x="640.0" y="276.0" width="530.0" height="84.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.4"/>
<rect x="640.0" y="276.0" width="140.0" height="84.0" rx="10" fill="#d6ebd6"/>
<rect x="770.0" y="276.0" width="10.0" height="84.0" fill="#d6ebd6"/>
<rect x="640.0" y="276.0" width="6.0" height="84.0" rx="3" fill="#008300"/>
<text x="658.0" y="304.0" font-size="15" font-weight="700">FAST</text>
<text x="658.0" y="324.0" font-size="12" class="s">→ L2 / L3</text>
<text x="658.0" y="342.0" font-size="11.5" class="m">决策 &lt;10ms</text>
<text x="790.0" y="302.0" font-size="12.5">条件：技能 ≥L2 · Beta 下界 ≥ τ_risk · 共形集 = 1 · 新颖 &lt; P90</text>
<text x="790.0" y="322.0" font-size="12" class="s">动作：直接执行技能条目（查表或展开运动程序）。</text>
<rect x="640.0" y="372.0" width="530.0" height="99.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.4"/>
<rect x="640.0" y="372.0" width="140.0" height="99.0" rx="10" fill="#fcf0d6"/>
<rect x="770.0" y="372.0" width="10.0" height="99.0" fill="#fcf0d6"/>
<rect x="640.0" y="372.0" width="6.0" height="99.0" rx="3" fill="#eda100"/>
<text x="658.0" y="400.0" font-size="13.5" font-weight="700">FAST+VERIFY</text>
<text x="658.0" y="420.0" font-size="12" class="s">→ 快路 + 影子</text>
<text x="658.0" y="438.0" font-size="11.5" class="m">试用期</text>
<text x="790.0" y="398.0" font-size="12.5">条件：技能在试用期，或下界落在 [τ_low, τ_risk)</text>
<text x="790.0" y="418.0" font-size="12" class="s">动作：快路先出结果，慢路在影子中核对；</text>
<text x="790.0" y="435.0" font-size="12" class="s">不一致以慢路为准，快路记一次失败并降级；</text>
<text x="790.0" y="452.0" font-size="12" class="s">落笔前 150–250ms 可撤回，已落笔则划掉重写。</text>
<rect x="640.0" y="483.0" width="530.0" height="84.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.4"/>
<rect x="640.0" y="483.0" width="140.0" height="84.0" rx="10" fill="#fce7df"/>
<rect x="770.0" y="483.0" width="10.0" height="84.0" fill="#fce7df"/>
<rect x="640.0" y="483.0" width="6.0" height="84.0" rx="3" fill="#eb6834"/>
<text x="658.0" y="511.0" font-size="15" font-weight="700">SLOW</text>
<text x="658.0" y="531.0" font-size="12" class="s">→ L0 深思</text>
<text x="658.0" y="549.0" font-size="11.5" class="m">0.1–5 s</text>
<text x="790.0" y="509.0" font-size="12.5">条件：新颖度高（认知不确定），或其余所有情况</text>
<text x="790.0" y="529.0" font-size="12" class="s">动作：按 U = P·V − λ·cost 排序调用专家，anytime 运行；</text>
<text x="790.0" y="546.0" font-size="12" class="s">计算价值 VOC 决定想多深；新颖时同时启动学习。</text>
<rect x="640.0" y="579.0" width="530.0" height="84.0" rx="10" fill="#fff" stroke="#e4e3df" stroke-width="1.4"/>
<rect x="640.0" y="579.0" width="140.0" height="84.0" rx="10" fill="#e2dff1"/>
<rect x="770.0" y="579.0" width="10.0" height="84.0" fill="#e2dff1"/>
<rect x="640.0" y="579.0" width="6.0" height="84.0" rx="3" fill="#4a3aa7"/>
<text x="658.0" y="607.0" font-size="15" font-weight="700">ASK</text>
<text x="658.0" y="627.0" font-size="12" class="s">→ 再看 / 提问</text>
<text x="658.0" y="645.0" font-size="11.5" class="m">最便宜</text>
<text x="790.0" y="605.0" font-size="12.5">条件：新颖度低但共形集 &gt; 1（偶然不确定）</text>
<text x="790.0" y="625.0" font-size="12" class="s">动作：先放大中央凹再看一眼、再听一遍；</text>
<text x="790.0" y="642.0" font-size="12" class="s">仍不确定就开口问：“是十二加七吗？”</text>
<path d="M640,237 H624 V621.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M624.0,318.0 L639.0,318.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
<path d="M624.0,421.5 L639.0,421.5" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
<path d="M624.0,525.0 L639.0,525.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
<path d="M624.0,621.0 L639.0,621.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
</svg>
