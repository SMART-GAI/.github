<circle cx="62.0" cy="118.0" r="6" fill="#eda100"/>
<text x="82.0" y="124.0" font-size="17" font-weight="700">清醒 · 在线快学</text>
<text x="50.0" y="146.0" font-size="12.5" class="s">毫秒到秒级 · 写完立即可用</text>
<circle cx="62.0" cy="180.0" r="11" fill="#eda100"/>
<text x="62.0" y="184.3" font-size="12" text-anchor="middle" font-weight="700" style="fill:#fff">1</text>
<text x="82.0" y="185.0" font-size="14" font-weight="700">情景一次写入</text>
<text x="82.0" y="205.0" font-size="12" class="s">M8 写入即可检索（HNSW 热层），满足一次学习</text>
<circle cx="62.0" cy="237.0" r="11" fill="#eda100"/>
<text x="62.0" y="241.3" font-size="12" text-anchor="middle" font-weight="700" style="fill:#fff">2</text>
<text x="82.0" y="242.0" font-size="14" font-weight="700">新概念原型</text>
<text x="82.0" y="262.0" font-size="12" class="s">一个样例就建原型，互动中追加视角；只有单一视角时</text>
<text x="82.0" y="279.0" font-size="12" class="s">ASK</text>
<circle cx="62.0" cy="311.0" r="11" fill="#eda100"/>
<text x="62.0" y="315.3" font-size="12" text-anchor="middle" font-weight="700" style="fill:#fff">3</text>
<text x="82.0" y="316.0" font-size="14" font-weight="700">词-物绑定</text>
<text x="82.0" y="336.0" font-size="12" class="s">拼音 + 声学模板为主键，更新共同注意贝叶斯计数</text>
<circle cx="62.0" cy="368.0" r="11" fill="#eda100"/>
<text x="62.0" y="372.3" font-size="12" text-anchor="middle" font-weight="700" style="fill:#fff">4</text>
<text x="82.0" y="373.0" font-size="14" font-weight="700">运动示范</text>
<text x="82.0" y="393.0" font-size="12" class="s">一次示范拟合 sigma-lognormal，多次示范增量更新</text>
<text x="82.0" y="410.0" font-size="12" class="s">ProMP</text>
<circle cx="62.0" cy="442.0" r="11" fill="#eda100"/>
<text x="62.0" y="446.3" font-size="12" text-anchor="middle" font-weight="700" style="fill:#fff">5</text>
<text x="82.0" y="447.0" font-size="14" font-weight="700">技能 Beta 后验</text>
<text x="82.0" y="467.0" font-size="12" class="s">慢路成功解进 L2 候选：Beta(2,1)，前 N 次</text>
<text x="82.0" y="484.0" font-size="12" class="s">FAST+VERIFY</text>
<circle cx="62.0" cy="516.0" r="11" fill="#eda100"/>
<text x="62.0" y="520.3" font-size="12" text-anchor="middle" font-weight="700" style="fill:#fff">6</text>
<text x="82.0" y="521.0" font-size="14" font-weight="700">路由与物理</text>
<text x="82.0" y="541.0" font-size="12" class="s">River 在线森林、Thompson 统计、物体参数后验</text>
<rect x="46.0" y="586.0" width="348.0" height="88.0" rx="10" fill="#fff" stroke="#f4c766" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="60.0" y="612.0" font-size="14" font-weight="700">微睡眠</text>
<text x="114.0" y="612.0" font-size="12" class="s">空闲 &gt;30s 时，持续几秒</text>
<text x="60.0" y="636.0" font-size="12" class="s">高优先级重放 · 单条 chunk 编译</text>
<text x="60.0" y="654.0" font-size="12" class="s">路由树增量更新</text>
<rect x="500.0" y="92.0" width="670.0" height="598.0" rx="14" fill="#f4f3fa" stroke="#b7b0dc" stroke-width="1.4"/>
<path d="M535,107 A11,11 0 1,0 542,124 A8.5,8.5 0 1,1 535,107 Z" fill="#4a3aa7" stroke="#4a3aa7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="552.0" y="124.0" font-size="17" font-weight="700">夜间睡眠 · 巩固</text>
<text x="520.0" y="146.0" font-size="12.5" class="s">充电或无人时 · RTX 4090 约 0.5–2 GPU·小时 · Jetson 只做轻量阶段（2–4 小时）</text>
<rect x="518.0" y="170.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="528.0" y="195.0" font-size="14" font-weight="700">① 优先重放</text>
<text x="528.0" y="220.0" font-size="12" class="s">优先级 = 惊奇</text>
<text x="528.0" y="238.0" font-size="12" class="s">× |奖励| × 社会</text>
<text x="528.0" y="256.0" font-size="12" class="s">× (1−CI) × 遗忘风险</text>
<text x="528.0" y="274.0" font-size="12" class="s">新 : 旧 = 1 : 3 交错</text>
<rect x="680.5" y="170.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="690.5" y="195.0" font-size="14" font-weight="700">② 原型整理</text>
<text x="690.5" y="220.0" font-size="12" class="s">HDBSCAN 合并/拆分</text>
<text x="690.5" y="238.0" font-size="12" class="s">剔除离群样例</text>
<text x="690.5" y="256.0" font-size="12" class="s">重校准开集阈值</text>
<text x="690.5" y="274.0" font-size="12" class="s">与 ACI 共形</text>
<rect x="843.0" y="170.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="853.0" y="195.0" font-size="14" font-weight="700">③ 编译与蒸馏</text>
<text x="853.0" y="220.0" font-size="12" class="s">chunk 编译 + Minton</text>
<text x="853.0" y="238.0" font-size="12" class="s">LM 解析 → 语法规则</text>
<text x="853.0" y="256.0" font-size="12" class="s">慢路 → LightGBM</text>
<text x="853.0" y="274.0" font-size="12" class="s">或 1–5M 小策略网</text>
<rect x="1005.5" y="170.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="1015.5" y="195.0" font-size="14" font-weight="700">④ 抽象（Stitch）</text>
<text x="1015.5" y="220.0" font-size="12" class="s">抽出部首、部件、</text>
<text x="1015.5" y="238.0" font-size="12" class="s">常用笔画组合</text>
<text x="1015.5" y="256.0" font-size="12" class="s">CPU 限时 20–30 分钟</text>
<rect x="1005.5" y="422.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="1015.5" y="447.0" font-size="14" font-weight="700">⑤ 小网络更新</text>
<text x="1015.5" y="472.0" font-size="12" class="s">投影头 · HCCR</text>
<text x="1015.5" y="490.0" font-size="12" class="s">摊销逆模型 · KWS</text>
<text x="1015.5" y="508.0" font-size="12" class="s">树模型重训 + 校准</text>
<text x="1015.5" y="526.0" font-size="12" class="s">编码器默认冻结</text>
<rect x="843.0" y="422.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="853.0" y="447.0" font-size="14" font-weight="700">⑥ 金丝雀门控</text>
<text x="853.0" y="472.0" font-size="12" class="s">每项都留测试样例</text>
<text x="853.0" y="490.0" font-size="12" class="s">（含外部数据）</text>
<text x="853.0" y="508.0" font-size="12" class="s">任一旧项降 &gt;2%</text>
<text x="853.0" y="526.0" font-size="12" class="s">→ 回滚该版本</text>
<rect x="680.5" y="422.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="690.5" y="447.0" font-size="14" font-weight="700">⑦ CI 损伤测试</text>
<text x="690.5" y="472.0" font-size="12" class="s">CI = 关 HPC 准确率</text>
<text x="690.5" y="490.0" font-size="12" class="s">÷ 开 HPC 准确率</text>
<text x="690.5" y="508.0" font-size="12" class="s">≥0.9 且两夜稳定</text>
<text x="690.5" y="526.0" font-size="12" class="s">→ 已巩固</text>
<rect x="518.0" y="422.0" width="146.5" height="132.0" rx="10" fill="#fff" stroke="#9b93cf" stroke-width="1.4"/>
<text x="528.0" y="447.0" font-size="14" font-weight="700">⑧ 报告</text>
<text x="528.0" y="472.0" font-size="12" class="s">巩固差异报告：</text>
<text x="528.0" y="490.0" font-size="12" class="s">新增 / 合并 / 拆分</text>
<text x="528.0" y="508.0" font-size="12" class="s">规则增删 · 回滚记录</text>
<text x="528.0" y="526.0" font-size="12" class="s">→ 睡眠剧场</text>
