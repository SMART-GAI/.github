<rect width="1200" height="720" rx="12" fill="#fcfcfb"/>
<text x="40.0" y="42.0" font-size="22" font-weight="700">学习循环：清醒时在线快学，睡眠时巩固</text>
<text x="40.0" y="68.0" font-size="14" class="s">清醒期全部追加式、不用梯度、可回滚；参数更新只在睡眠期进行，并受金丝雀门控。</text>
