<text x="522.0" y="346.0" font-size="13" font-weight="700">防遗忘</text>
<text x="580.0" y="346.0" font-size="12" class="s">主干冻结 · 非参数知识只增不改 · 每个概念独立原型与分类头</text>
<text x="580.0" y="365.0" font-size="12" class="s">交错重放 · 规则之间只做加法竞争 · 金丝雀门控 + 版本快照</text>
<path d="M916.2,554 V584" fill="none" stroke="#e34948" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ahe34948)"/>
<rect x="847.0" y="586.0" width="138.5" height="30.0" rx="15" fill="#fff" stroke="#e34948" stroke-width="1.3"/>
<text x="916.2" y="606.0" font-size="12" text-anchor="middle">回滚到上一版本快照</text>
<path d="M753.8,554 V584" fill="none" stroke="#008300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah008300)"/>
<rect x="684.5" y="586.0" width="138.5" height="30.0" rx="15" fill="#fff" stroke="#008300" stroke-width="1.3"/>
<text x="753.8" y="606.0" font-size="12" text-anchor="middle">标为已巩固，可要点化</text>
<path d="M410.0,236.0 L517.0,236.0" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
<text x="464.0" y="214.0" font-size="12.5" text-anchor="middle" font-weight="700">入睡</text>
<text x="464.0" y="229.0" font-size="11.5" text-anchor="middle" class="s">情景 + 日志</text>
<path d="M518.0,488.0 L411.0,488.0" fill="none" stroke="#52514e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah52514e)"/>
<text x="464.0" y="466.0" font-size="12.5" text-anchor="middle" font-weight="700">醒来</text>
<text x="464.0" y="481.0" font-size="11.5" text-anchor="middle" class="s">新版本上线</text>
<text x="520.0" y="670.0" font-size="12.5" class="s">“越熟越懂”可测：更快 · 更准 · 更深 · 更省 · 更有自知之明（UD、CI、BWT、ECE、J/task）</text>
</svg>
