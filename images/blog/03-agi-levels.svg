<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" role="img" aria-label="AGI 分级示意图">
<title>AGI 分级示意图</title>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif;fill:#0b0b0b} .s{fill:#52514e} .m{fill:#8a8984}</style>
<rect width="920" height="450" rx="12" fill="#fcfcfb"/>
<text x="40" y="44" font-size="22" font-weight="700">AGI 的“段位”：Google DeepMind 提出的 6 个等级</text>
<text x="40" y="70" font-size="14" class="s">来源：Morris 等《Levels of AGI》（2023），按“超过多少比例的熟练成年人”分级；示例为论文发表时的判断。</text>
<rect x="40" y="330" width="134" height="90" rx="8" fill="#e9f1fb"/>
<text x="107" y="358" font-size="18" font-weight="700" text-anchor="middle" style="fill:#0b0b0b">L0 无 AI</text>
<text x="107" y="382" font-size="12" text-anchor="middle" style="fill:#0b0b0b">计算器、编译器</text>
<rect x="182" y="278" width="134" height="142" rx="8" fill="#d3e3f6"/>
<text x="249" y="306" font-size="18" font-weight="700" text-anchor="middle" style="fill:#0b0b0b">L1 初现</text>
<text x="249" y="330" font-size="12" text-anchor="middle" style="fill:#0b0b0b">与普通人相当或略好</text>
<text x="249" y="348" font-size="12" text-anchor="middle" style="fill:#0b0b0b"></text>
<text x="249" y="366" font-size="12" text-anchor="middle" style="fill:#0b0b0b">例：2023 年的</text>
<text x="249" y="384" font-size="12" text-anchor="middle" style="fill:#0b0b0b">ChatGPT、Llama 2</text>
<rect x="324" y="226" width="134" height="194" rx="8" fill="#a9c6ea"/>
<text x="391" y="254" font-size="18" font-weight="700" text-anchor="middle" style="fill:#0b0b0b">L2 胜任</text>
<text x="391" y="278" font-size="12" text-anchor="middle" style="fill:#0b0b0b">超过 50% 的</text>
<text x="391" y="296" font-size="12" text-anchor="middle" style="fill:#0b0b0b">熟练成年人</text>
<rect x="466" y="174" width="134" height="246" rx="8" fill="#7eaae0"/>
<text x="533" y="202" font-size="18" font-weight="700" text-anchor="middle" style="fill:#fff">L3 专家</text>
<text x="533" y="226" font-size="12" text-anchor="middle" style="fill:#fff">超过 90% 的</text>
<text x="533" y="244" font-size="12" text-anchor="middle" style="fill:#fff">熟练成年人</text>
<rect x="608" y="122" width="134" height="298" rx="8" fill="#5590d8"/>
<text x="675" y="150" font-size="18" font-weight="700" text-anchor="middle" style="fill:#fff">L4 大师</text>
<text x="675" y="174" font-size="12" text-anchor="middle" style="fill:#fff">超过 99% 的</text>
<text x="675" y="192" font-size="12" text-anchor="middle" style="fill:#fff">熟练成年人</text>
<rect x="750" y="70" width="134" height="350" rx="8" fill="#2a78d6"/>
<text x="817" y="98" font-size="18" font-weight="700" text-anchor="middle" style="fill:#fff">L5 超人</text>
<text x="817" y="122" font-size="12" text-anchor="middle" style="fill:#fff">超过所有人类</text>
<text x="817" y="140" font-size="12" text-anchor="middle" style="fill:#fff"></text>
<text x="817" y="158" font-size="12" text-anchor="middle" style="fill:#fff">专用领域已有：</text>
<text x="817" y="176" font-size="12" text-anchor="middle" style="fill:#fff">AlphaFold、AlphaZero</text>
</svg>
