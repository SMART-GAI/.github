<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="大语言模型预测下一个字的示意图">
<title>大语言模型预测下一个字的示意图</title>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif;fill:#0b0b0b} .s{fill:#52514e} .m{fill:#8a8984}</style>
<rect width="900" height="360" rx="12" fill="#fcfcfb"/>
<text x="450.0" y="42" font-size="22" font-weight="700" text-anchor="middle">大语言模型在做什么？——“猜下一个字”</text>
<rect x="40" y="150" width="44" height="44" rx="8" fill="#fff" stroke="#52514e" stroke-width="1.5"/>
<text x="62" y="179" font-size="20" text-anchor="middle">今</text>
<rect x="92" y="150" width="44" height="44" rx="8" fill="#fff" stroke="#52514e" stroke-width="1.5"/>
<text x="114" y="179" font-size="20" text-anchor="middle">天</text>
<rect x="144" y="150" width="44" height="44" rx="8" fill="#fff" stroke="#52514e" stroke-width="1.5"/>
<text x="166" y="179" font-size="20" text-anchor="middle">天</text>
<rect x="196" y="150" width="44" height="44" rx="8" fill="#fff" stroke="#52514e" stroke-width="1.5"/>
<text x="218" y="179" font-size="20" text-anchor="middle">气</text>
<rect x="248" y="150" width="44" height="44" rx="8" fill="#fff" stroke="#52514e" stroke-width="1.5"/>
<text x="270" y="179" font-size="20" text-anchor="middle">真</text>
<text x="165" y="226" font-size="13" class="s" text-anchor="middle">输入：已经写出的文字</text>
<path d="M310,172 H360" stroke="#8a8984" stroke-width="2" marker-end="url(#ar)"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect x="370" y="110" width="170" height="124" rx="14" fill="#2a78d6"/>
<text x="455" y="160" font-size="18" font-weight="700" text-anchor="middle" style="fill:#fff">神经网络</text>
<text x="455" y="186" font-size="13" text-anchor="middle" style="fill:#fff">（千亿个可调旋钮）</text>
<text x="455" y="208" font-size="13" text-anchor="middle" style="fill:#fff">Transformer</text>
<path d="M548,172 H598" stroke="#8a8984" stroke-width="2" marker-end="url(#ar)"/>
<text x="625" y="119" font-size="18" text-anchor="middle">好</text>
<rect x="645" y="104" width="204.6" height="20" rx="4" fill="#2a78d6"/>
<text x="857.6" y="119" font-size="13" class="s">62%</text>
<text x="625" y="155" font-size="18" text-anchor="middle">不</text>
<rect x="645" y="140" width="49.5" height="20" rx="4" fill="#a9c6ea"/>
<text x="702.5" y="155" font-size="13" class="s">15%</text>
<text x="625" y="191" font-size="18" text-anchor="middle">热</text>
<rect x="645" y="176" width="29.7" height="20" rx="4" fill="#a9c6ea"/>
<text x="682.7" y="191" font-size="13" class="s">9%</text>
<text x="625" y="227" font-size="18" text-anchor="middle">冷</text>
<rect x="645" y="212" width="19.8" height="20" rx="4" fill="#a9c6ea"/>
<text x="672.8" y="227" font-size="13" class="s">6%</text>
<text x="625" y="263" font-size="18" text-anchor="middle">…</text>
<rect x="645" y="248" width="26.4" height="20" rx="4" fill="#a9c6ea"/>
<text x="679.4" y="263" font-size="13" class="s">8%</text>
<text x="740" y="296" font-size="13" class="s" text-anchor="middle">输出：下一个字的概率（示意）</text>
<text x="450.0" y="334" font-size="14" text-anchor="middle">选出“好”，接到句尾，再猜下一个字……一个字一个字地“接龙”，就写出了整段回答。</text>
</svg>
